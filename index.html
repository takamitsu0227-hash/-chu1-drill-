<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中1 総復習ドリル</title>
<style>
:root{--bg:#F2F6F9;--ink:#13263A;--mut:#566879;--card:#FFFFFF;--line:#CCD8E2;--ok:#17703F;--okbg:#E0F3E8;--ng:#B3261E;--ngbg:#FBE6E4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1822;--ink:#E8EEF4;--mut:#9AABBB;--card:#16242F;--line:#2B3C4A;--ok:#6FD39B;--okbg:#14301F;--ng:#FF8A80;--ngbg:#3A1B19}}
:root[data-theme="dark"]{--bg:#0E1822;--ink:#E8EEF4;--mut:#9AABBB;--card:#16242F;--line:#2B3C4A;--ok:#6FD39B;--okbg:#14301F;--ng:#FF8A80;--ngbg:#3A1B19}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif;line-height:1.6;font-size:17px}
#app{max-width:560px;margin:0 auto;padding:20px 16px 48px}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top h1{font-size:28px;margin:8px 0 4px;letter-spacing:.02em}
.mut{color:var(--mut);margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.subj{background:var(--acc);color:#fff;border:0;border-radius:16px;padding:16px;text-align:left;min-height:156px;display:flex;flex-direction:column;gap:6px;font:inherit;cursor:pointer}
.subj .nm{font-size:34px;font-weight:800;line-height:1.1}
.subj .sb{font-size:13px;line-height:1.45;opacity:.95}
.subj .bs{font-size:12px;margin-top:auto;line-height:1.5;opacity:.95}
.subj:active{transform:scale(.98)}
.subj[aria-disabled="true"]{opacity:.55}
.note{color:var(--mut);font-size:14px;margin-top:22px}
.back{background:none;border:0;color:var(--mut);font:inherit;font-size:15px;padding:8px 0;cursor:pointer}
.hd{border-left:8px solid var(--acc);padding:4px 0 4px 14px;margin:8px 0 20px}
.hd h2{font-size:30px;margin:0}
.hd p{margin:0;color:var(--mut);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:17px;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px 16px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;gap:2px;justify-content:center}
.btn small{color:var(--mut);font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.choice:disabled{opacity:1;cursor:default}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.ng{border-color:var(--ng);background:var(--ngbg)}
.qh{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--acc)}
.unit{display:inline-block;background:var(--acc);color:#fff;padding:2px 12px;border-radius:99px;font-size:13px;margin:0}
.q{font-size:21px;line-height:1.55;margin:12px 0 18px;font-weight:700}
.exp{border-radius:12px;padding:12px 16px;margin:14px 0}
.exp p{margin:4px 0 0}
.exp.good{background:var(--okbg);border:2px solid var(--ok)}
.exp.bad{background:var(--ngbg);border:2px solid var(--ng)}
.exp.ans{background:var(--card);border:2px solid var(--line)}
.exp .a{font-size:20px;font-weight:700}
.next,.reveal{background:var(--acc);color:#fff;border-color:var(--acc);align-items:center;font-weight:700;width:100%;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{align-items:center;font-weight:700}
.two .good{border-color:var(--ok)}
.two .bad{border-color:var(--ng)}
.res{border-left:8px solid var(--acc);padding-left:14px;margin:8px 0 20px}
.sc b{font-size:56px;line-height:1.1}
.sc span{font-size:22px;color:var(--mut)}
h3{font-size:18px;margin:8px 0 10px}
.miss{list-style:none;padding:0;margin:0 0 20px}
.miss li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.miss p{margin:0}
.miss .ans{color:var(--ok);font-weight:700;margin-top:4px}
</style>
</head>

const K = "chu1-drill-v2";
const app = document.getElementById("app");
function load(){ try { return JSON.parse(localStorage.getItem(K)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(K, JSON.stringify(st)); } catch(e){} }
let st = load(); st.wrong = st.wrong || {}; st.best = st.best || {};
let run = null;
const ALL = {id:"all", name:"全教科", col:"#4B5B6B"};

const shuf = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const byId = id => id === "all" ? ALL : SUBJ.find(x => x.id === id);

function itemsOfSubj(s){
  const out = [];
  s.c.forEach((r,i) => out.push({id:s.id+"-c"+i, sn:s.name, col:s.col, t:"c", u:r[0], q:r[1], ch:r[2], a:r[3], e:r[4]}));
  s.f.forEach((r,i) => out.push({id:s.id+"-f"+i, sn:s.name, col:s.col, t:"f", q:r[0], a:r[1]}));
  return out;
}
function allItems(s){ return s.id === "all" ? SUBJ.flatMap(itemsOfSubj) : itemsOfSubj(s); }
function wrongCount(s){ return allItems(s).filter(it => st.wrong[it.id]).length; }
function bestText(s){
  const p = [];
  if (st.best[s.id+"-c"] != null) p.push("4択 最高 "+st.best[s.id+"-c"]+"/"+s.c.length);
  if (st.best[s.id+"-f"] != null) p.push("一問一答 覚えた "+st.best[s.id+"-f"]+"/"+s.f.length);
  return p.length ? p.join("<br>") : "まだ挑戦していません";
}

function home(){
  run = null;
  const wn = wrongCount(ALL);
  app.innerHTML = '<header class="top"><h1>中1 総復習ドリル</h1><p class="mut">1年分（〜3月）・帯広柏葉をめざして</p></header>' +
    '<div class="grid">' + SUBJ.map(s =>
      '<button class="subj" data-s="'+s.id+'" style="--acc:'+s.col+'"><span class="nm">'+s.name+'</span><span class="sb">'+s.sub+'</span><span class="bs">'+bestText(s)+'</span></button>'
    ).join("") +
    '<button class="subj" id="allw" style="--acc:'+ALL.col+'"'+(wn?'':' aria-disabled="true"')+'><span class="nm">復習</span><span class="sb">全教科の間違えた問題をまとめて</span><span class="bs">'+(wn ? wn+'問たまっています' : 'まだ間違いはありません')+'</span></button>' +
    '</div>' +
    '<p class="note">間違えた問題は自動で記録されます。記録はこの端末のブラウザに保存されます。</p>';
  app.querySelectorAll(".subj[data-s]").forEach(b => b.onclick = () => menu(b.dataset.s));
  document.getElementById("allw").onclick = () => { if (wn) start("all", "w"); };
  window.scrollTo(0,0);
}

function menu(id){
  if (id === "all") { home(); return; }
  const s = byId(id), wn = wrongCount(s);
  run = null;
  app.innerHTML = '<div style="--acc:'+s.col+'"><button class="back" id="bk">← 教科えらびにもどる</button>' +
    '<div class="hd"><h2>'+s.name+'</h2><p>'+s.sub+'</p></div><div class="stack">' +
    '<button class="btn" data-m="c"><b>4択問題</b><small>'+s.c.length+'問</small></button>' +
    '<button class="btn" data-m="f"><b>一問一答</b><small>'+s.f.length+'問・答えを思い出してから確認</small></button>' +
    '<button class="btn" data-m="w"'+(wn?'':' disabled')+'><b>間違えた問題だけ</b><small>'+wn+'問</small></button>' +
    '</div></div>';
  document.getElementById("bk").onclick = home;
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => start(id, b.dataset.m));
  window.scrollTo(0,0);
}

function start(id, mode){
  const s = byId(id);
  let list = allItems(s);
  if (mode === "c") list = list.filter(x => x.t === "c");
  else if (mode === "f") list = list.filter(x => x.t === "f");
  else list = list.filter(x => st.wrong[x.id]);
  if (!list.length) { menu(id); return; }
  run = {s:s, mode:mode, list:shuf(list), i:0, score:0, miss:[]};
  show();
}

function rec(it, ok){
  if (ok) { run.score++; delete st.wrong[it.id]; }
  else { st.wrong[it.id] = 1; run.miss.push(it); }
  save();
}
function next(){
  run.i++;
  window.scrollTo(0,0);
  if (run.i >= run.list.length) finish(); else show();
}

function show(){
  const r = run, it = r.list[r.i], last = r.i === r.list.length-1;
  const pct = Math.round(r.i / r.list.length * 100);
  const col = r.s.id === "all" ? it.col : r.s.col;
  const label = r.s.id === "all" ? it.sn : r.s.name;
  const head = '<div style="--acc:'+col+'"><div class="qh"><button class="back" id="qt">やめる</button><span>'+label+'　'+(r.i+1)+' / '+r.list.length+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
  if (it.t === "c") {
    const ch = shuf(it.ch.map((t,k) => ({t:t, ok:k===it.a})));
    app.innerHTML = head + '<p class="unit">'+it.u+'</p><h2 class="q">'+it.q+'</h2><div class="stack">' +
      ch.map((c,k) => '<button class="btn choice" data-k="'+k+'">'+c.t+'</button>').join("") +
      '</div><div id="fb"></div></div>';
    const btns = app.querySelectorAll(".choice");
    btns.forEach(b => b.onclick = () => {
      const c = ch[b.dataset.k];
      btns.forEach((x,k) => { x.disabled = true; if (ch[k].ok) x.classList.add("ok"); });
      if (!c.ok) b.classList.add("ng");
      rec(it, c.ok);
      document.getElementById("fb").innerHTML = '<div class="exp '+(c.ok?'good':'bad')+'"><b>'+(c.ok?'正解！':'ざんねん…')+'</b><p>'+it.e+'</p></div><button class="btn next" id="nx">'+(last?'結果を見る':'つぎへ')+'</button>';
      document.getElementById("nx").onclick = next;
    });
  } else {
    app.innerHTML = head + '<p class="unit">一問一答</p><h2 class="q">'+it.q+'</h2><div id="fb"><button class="btn reveal" id="rv">答えを見る</button></div></div>';
    document.getElementById("rv").onclick = () => {
      document.getElementById("fb").innerHTML = '<div class="exp ans"><small>こたえ</small><p class="a">'+it.a+'</p></div><div class="two"><button class="btn bad" id="no">まだ</button><button class="btn good" id="yes">覚えた</button></div>';
      document.getElementById("yes").onclick = () => { rec(it, true); next(); };
      document.getElementById("no").onclick = () => { rec(it, false); next(); };
    };
  }
  document.getElementById("qt").onclick = () => menu(r.s.id);
}

function finish(){
  const r = run, n = r.list.length;
  const names = {c:"4択問題", f:"一問一答", w:"間違えた問題"};
  if (r.mode !== "w") { const key = r.s.id+"-"+r.mode; if ((st.best[key]||0) < r.score) st.best[key] = r.score; save(); }
  const ratio = r.score / n;
  const msg = ratio >= 0.9 ? "かんぺき！この調子です。" : ratio >= 0.7 ? "いい調子。間違えたところを見直そう。" : "まだのびしろあり。間違えた問題だけ、もう一度やってみよう。";
  app.innerHTML = '<div style="--acc:'+r.s.col+'"><div class="res"><p class="mut">'+r.s.name+'・'+names[r.mode]+'</p><div class="sc"><b>'+r.score+'</b><span> / '+n+'</span></div><p>'+msg+'</p></div>' +
    (r.miss.length ? '<h3>見直そう</h3><ul class="miss">' + r.miss.map(m => '<li><p>'+m.q+'</p><p class="ans">'+(m.t==="c" ? m.ch[m.a] : m.a)+'</p></li>').join("") + '</ul>' : '') +
    '<div class="stack"><button class="btn" id="re"><b>もう一度</b></button>' +
    (r.miss.length ? '<button class="btn" id="rm"><b>間違えた問題だけやり直す</b></button>' : '') +
    '<button class="btn" id="mn"><b>メニューにもどる</b></button></div></div>';
  document.getElementById("re").onclick = () => start(r.s.id, r.mode);
  const rm = document.getElementById("rm");
  if (rm) rm.onclick = () => { run = {s:r.s, mode:"w", list:shuf(r.miss), i:0, score:0, miss:[]}; show(); };
  document.getElementById("mn").onclick = () => menu(r.s.id);
}

home();
</script>
